<!DOCTYPE html>
<html lang="en">
    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


  <style>
    .rectangle {
        height: 150px;
        width: 100%;
        background-color: #070088ca;
        }

  </style>
    </head>

    <body style="background-color:white;">
      <div class = heading>
        <div class="row rectangle">
          <h1 style="color:white; text-align: center; margin-top:20px;">Meal Picker</h1>
          <h2 style="color:white; text-align: center;">Fill out the form to get the meal you're looking for!</h2>
        </div>
      </div>

      <form style="background-color:whitesmoke; width:50%; margin: 30px;">
        <h4 style="margin: 10px; margin-top: 10px;">Enter an ingredient you would like to cook with</h4>
        <input class="form-check-input shadow-sm" style="width: 80%;height: 30px; margin-left: 10px;"></input>

        <h4 style="margin: 10px; margin-top: 10px;">Select a cuisine you would like to eat</h4>
        <select class="form-select shadow-sm"style="margin: 10px;width: 80%;">
          <option value="Algerian">Algerian</option>
          <option value="American">American</option>
          <option value="Argentinian">Argentinian</option>
          <option value="Australian">Australian</option>
          <option value="British">British</option>
          <option value="Canadian">Canadian</option>
          <option value="Chinese">Chinese</option>
          <option value="Croatian">Croatian</option>
          <option value="Dutch">Dutch</option>
          <option value="Egyptian">Egyptian</option>
          <option value="Filipino">Filipino</option>
          <option value="French">French</option>
          <option value="Greek">Greek</option>
          <option value="Indian">Indian</option>
          <option value="Irish">Irish</option>
          <option value="Italian">Italian</option>
          <option value="Jamaican">Jamaican</option>
          <option value="Japanese">Japanese</option>
          <option value="Kenyan">Kenyan</option>
          <option value="Malaysian">Malaysian</option>
          <option value="Mexican">Mexican</option>
          <option value="Moroccan">Moroccan</option>
          <option value="Norwegian">Norwegian</option>
          <option value="Polish">Polish</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Russian">Russian</option>
          <option value="Saudi Arabian">Saudi Arabian</option>
          <option value="Slovakian">Slovakian</option>
          <option value="Spanish">Spanish</option>
          <option value="Syrian">Syrian</option>
          <option value="Thai">Thai</option>
          <option value="Tunisian">Tunisian</option>
          <option value="Turkish">Turkish</option>
          <option value="Ukrainian">Ukrainian</option>
          <option value="Uruguayan">Uruguayan</option>
          <option value="Venezulan">Venezulan</option>
          <option value="Vietnamese">Vietnamese</option>
        </select>

        <h4 style="margin: 10px; margin-top: 10px;">Select a category of food</h4>
        <select class="form-select shadow-sm" style="margin: 10px;width: 80%;">
          <option value="Beef">Beef</option>
          <option value="Breakfast">Breakfast</option>
          <option value="Chicken">Chicken</option>
          <option value="Dessert">Dessert</option>
          <option value="Goat">Goat</option>
          <option value="Lamb">Lamb</option>
          <option value="Miscellaneous">Miscellaneous</option>
          <option value="Pasta">Pasta</option>
          <option value="Pork">Pork</option>
          <option value="Seafood">Seafood</option>
          <option value="Side">Side</option>
          <option value="Starter">Starter</option>
          <option value="Vegan">Vegan</option>
          <option value="Vegetarian">Vegetarian</option>
        </select>

      </form>
    </body>
</html>
